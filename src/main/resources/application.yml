spring:
  application:
    name: next-trend-breakout-strategy

server:
  port: 8082

next:
  api:
    client-id: ${NEXT_CLIENT_ID:}
    client-secret: ${NEXT_CLIENT_SECRET:}
    account-id: ${NEXT_ACCOUNT_ID:acc_main}
  engine:
    max-consecutive-failures: 5

trend-breakout:
  symbols: AAPL,NVDA
  lookback: 120
  profit-rate: 0.04
  volume-ratio: 0
  expire-hours: 12
  budget-ratio: 0.5
  poll-seconds: 60
